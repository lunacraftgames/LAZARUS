<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LAZARUS</title>
<style>
  html, body { margin: 0; height: 100%; background: #050607; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; box-shadow: 0 0 60px rgba(0,0,0,.8); }
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  .tb { position: absolute; pointer-events: auto; width: 76px; height: 76px; border-radius: 50%;
        background: rgba(255,255,255,.07); border: 2px solid rgba(140,255,230,.35); color: rgba(200,255,240,.85);
        font: bold 15px "Microsoft YaHei","PingFang SC",sans-serif; display: flex; align-items: center; justify-content: center; }
  .tb.on { background: rgba(140,255,230,.25); }
  /* 十字方向键：四个键同样大小；箭头用 CSS 三角形绘制（iOS 会把 ◀ ▶ 字符渲染成彩色 emoji） */
  .dp { width: 56px; height: 56px; box-sizing: border-box; }
  .dp::before { content: ''; width: 0; height: 0; border: 11px solid transparent; }
  #tu::before { border-bottom: 16px solid rgba(200,255,240,.85); border-top-width: 0; margin-top: -4px; }
  #td::before { border-top: 16px solid rgba(200,255,240,.85); border-bottom-width: 0; margin-top: 4px; }
  #tl::before { border-right: 16px solid rgba(200,255,240,.85); border-left-width: 0; margin-left: -4px; }
  #tr::before { border-left: 16px solid rgba(200,255,240,.85); border-right-width: 0; margin-left: 4px; }
  #tu { left: 68px; bottom: 130px; } #tl { left: 10px; bottom: 72px; } #tr { left: 126px; bottom: 72px; } #td { left: 68px; bottom: 14px; }
  #tj { right: 24px; bottom: 30px; width: 88px; height: 88px; } #tx { right: 124px; bottom: 60px; }
  #ta { right: 44px; bottom: 132px; width: 60px; height: 60px; font-size: 13px; }
  #tw { right: 132px; bottom: 150px; width: 52px; height: 52px; font-size: 12px; }
  #tp { right: 16px; top: 70px; width: 46px; height: 46px; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="tb dp" id="tu" data-act="up"></div>
  <div class="tb dp" id="tl" data-act="left"></div>
  <div class="tb dp" id="tr" data-act="right"></div>
  <div class="tb dp" id="td" data-act="down"></div>
  <div class="tb" id="tj" data-act="jump,confirm">跳跃</div>
  <div class="tb" id="tx" data-act="dash">冲刺</div>
  <div class="tb" id="ta" data-act="attack">攻击</div>
  <div class="tb" id="tw" data-act="swap">换</div>
  <div class="tb" id="tp" data-act="pause">II</div>
</div>
<!-- 脚本后面的 ?v= 是版本号：每次发布时和 js/core.js 里的 BUILD 一起修改，避免浏览器继续使用缓存里的旧文件 -->
<script src="js/core.js?v=20260925-6"></script>
<script src="js/input.js?v=20260925-6"></script>
<script src="js/inventory.js?v=20260925-6"></script>
<script src="js/audio.js?v=20260925-6"></script>
<script src="js/art.js?v=20260925-6"></script>
<script src="js/player.js?v=20260925-6"></script>
<script src="js/entities.js?v=20260925-6"></script>
<script src="js/boss.js?v=20260925-6"></script>
<script src="js/levels.js?v=20260925-6"></script>
<script src="js/chapter2.js?v=20260925-6"></script>
<script src="js/chapter3.js?v=20260925-6"></script>
<script src="js/chapter4.js?v=20260925-6"></script>
<script src="js/game.js?v=20260925-6"></script>
<script src="js/weapons.js?v=20260925-6"></script>
<script src="js/item_art.js?v=20260925-6"></script>
<script src="js/ui_inventory.js?v=20260925-6"></script>
<script src="js/ui_keys.js?v=20260925-6"></script>
<script src="js/ui_audio.js?v=20260925-6"></script>
</body>
</html>

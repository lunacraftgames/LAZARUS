<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LAZARUS · 第一章 死寂博物馆</title>
<style>
  html, body { margin: 0; height: 100%; background: #050607; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; box-shadow: 0 0 60px rgba(0,0,0,.8); }
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  .tb { position: absolute; pointer-events: auto; width: 76px; height: 76px; border-radius: 50%;
        background: rgba(255,255,255,.07); border: 2px solid rgba(140,255,230,.35); color: rgba(200,255,240,.85);
        font: bold 15px "Microsoft YaHei","PingFang SC",sans-serif; display: flex; align-items: center; justify-content: center; }
  .tb.on { background: rgba(140,255,230,.25); }
  #tl { left: 22px; bottom: 26px; } #tr { left: 112px; bottom: 26px; }
  #td { left: 67px; bottom: 108px; width: 60px; height: 60px; font-size: 13px; }
  #tj { right: 24px; bottom: 30px; width: 88px; height: 88px; } #tx { right: 124px; bottom: 60px; }
  #ta { right: 44px; bottom: 132px; width: 60px; height: 60px; font-size: 13px; }
  #tp { right: 16px; top: 70px; width: 46px; height: 46px; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="tb" id="tl" data-act="left">◀</div>
  <div class="tb" id="tr" data-act="right">▶</div>
  <div class="tb" id="td" data-act="down">▼</div>
  <div class="tb" id="tj" data-act="jump,confirm">跳跃</div>
  <div class="tb" id="tx" data-act="dash">冲刺</div>
  <div class="tb" id="ta" data-act="attack">攻击</div>
  <div class="tb" id="tp" data-act="pause">II</div>
</div>
<script src="js/core.js"></script>
<script src="js/input.js"></script>
<script src="js/inventory.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/player.js"></script>
<script src="js/entities.js"></script>
<script src="js/boss.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/ui_inventory.js"></script>
<script src="js/ui_keys.js"></script>
</body>
</html>
